# Local development database: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ulock_db
      POSTGRES_USER: ulock
      POSTGRES_PASSWORD: ulock
    ports:
      - "${ULOCK_DB_PORT:-5432}:5432"
    volumes:
      - ulock-db:/var/lib/postgresql/data

volumes:
  ulock-db:
